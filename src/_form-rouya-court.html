<form class="form lp-form lp-form--court" action="mailto:contact@chalets-lombard.fr" method="post" enctype="text/plain" novalidate data-lead-form data-form-place="%p%">
  <input type="hidden" name="programme" value="la-rouya">
  <input type="hidden" name="souhait" value="plans">
  <input type="hidden" name="souhait" value="prix">
  <input type="hidden" name="souhait" value="visite">
  <div class="field"><label class="form__l" for="%p%-nom">Prénom et nom</label><input class="field__i" id="%p%-nom" name="nom" type="text" autocomplete="name" required aria-describedby="%p%-nom-e"><p class="field__e" id="%p%-nom-e" hidden>Indiquez votre prénom et votre nom.</p></div>
  <div class="field"><label class="form__l" for="%p%-email">E-mail</label><input class="field__i" id="%p%-email" name="email" type="email" autocomplete="email" inputmode="email" required aria-describedby="%p%-email-e"><p class="field__e" id="%p%-email-e" hidden>Indiquez une adresse e-mail valide.</p></div>
  <div class="field"><label class="form__l" for="%p%-tel">Téléphone <span class="form__opt">(facultatif)</span></label><input class="field__i" id="%p%-tel" name="tel" type="tel" autocomplete="tel" inputmode="tel"></div>
  <div class="form__hp" aria-hidden="true"><label for="%p%-site">Site web</label><input id="%p%-site" name="site" type="text" tabindex="-1" autocomplete="off"></div>
  <div class="consent">
    <input id="%p%-ok" name="consentement" type="checkbox" required aria-describedby="%p%-ok-e">
    <label for="%p%-ok">J’accepte que Lombard Vasina utilise ces informations pour me recontacter au sujet de La Rouya. <a class="link" href="https://www.chalets-lombard.fr/mentions-legales/">Mentions légales</a></label>
    <p class="field__e" id="%p%-ok-e" hidden>Votre accord est nécessaire pour que nous puissions vous répondre.</p>
  </div>
  <div class="form__end">
    <button class="btn btn--submit lp-submit" type="submit"><span class="btn__label">Recevoir les plans et le prix</span><svg class="ico ico--arrow" aria-hidden="true"><use href="#i-arrow"/></svg><svg class="btn__check" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10.5l4 4 8-9"/></svg></button>
    <p class="form__msg" role="status" aria-live="polite"></p>
  </div>
</form>
